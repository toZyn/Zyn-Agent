name: One-time branch cleanup

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  prune:
    if: github.repository == 'toZyn/Zyn-Agent' && github.event.head_commit.message == 'chore: run one-time branch cleanup'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delete branches other than main
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate --jq '.[].name' "repos/${GITHUB_REPOSITORY}/branches?per_page=100" | while IFS= read -r branch; do
            if [ "$branch" != "main" ]; then
              echo "Removing branch: $branch"
              gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}"
            fi
          done
