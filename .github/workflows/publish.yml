name: Publish to npm (manual approval only)

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --global 'npm@^11.5.1'
      - run: npm ci
      - run: npm run test:all
      - name: Configure npm token if configured
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if test -n "${NPM_TOKEN:-}"; then
            printf '//registry.npmjs.org/:_authToken=%s\n' "$NPM_TOKEN" >> "$HOME/.npmrc"
            chmod 600 "$HOME/.npmrc"
          fi
      - name: Publish current package version
        run: |
          set -euo pipefail
          name="$(node -p 'require("./package.json").name')"
          version="$(node -p 'require("./package.json").version')"
          if npm view "${name}@${version}" version --json >/dev/null 2>&1; then
            echo "${name}@${version} is already on npm. No publication necessary."
          else
            npm publish --access public --provenance
          fi
