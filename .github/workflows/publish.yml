name: Publish to npm (manual approval only)

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: "github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'npm: validate trusted publishing v1.7.0'"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --global 'npm@^11.5.1'
      - run: npm ci
      - run: npm run test:all
      - name: Publish current package version
        run: |
          set -euo pipefail
          name="$(node -p 'require("./package.json").name')"
          version="$(node -p 'require("./package.json").version')"
          if npm view "${name}@${version}" version --json >/dev/null 2>&1; then
            echo "${name}@${version} is already on npm. No publication necessary."
          else
            npm publish --access public --provenance
          fi
