name: npm publication v1.7.0 (one-time)

on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: "github.event.head_commit.message == 'npm: publish v1.7.0'"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v1.7.0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --global 'npm@^11.5.1'
      - run: npm ci
      - run: npm run test:all
      - name: Verify exact release before publication
        run: |
          set -euo pipefail
          test "$(node -p 'require("./package.json").version')" = '1.7.0'
          test "$(git rev-parse HEAD)" = '4cd4a1713bbe4ad49f0ad13298c91113dfc9901b'
          npm pack --dry-run --json > /tmp/zyn-npm-pack.json
          node -e 'const p=require("/tmp/zyn-npm-pack.json")[0]; if (!p.files.some(f=>f.path==="CHANGELOG.md") || p.files.some(f=>/account\.json$/.test(f.path))) process.exit(1); console.log(`Checked ${p.files.length} package files`)'
      - name: Configure npm token only when present
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if test -n "${NPM_TOKEN:-}"; then
            printf '//registry.npmjs.org/:_authToken=%s\n' "$NPM_TOKEN" >> "$HOME/.npmrc"
            chmod 600 "$HOME/.npmrc"
          fi
      - name: Publish version 1.7.0 to npmjs
        run: |
          set -euo pipefail
          if npm view zyn-ai@1.7.0 version --json >/dev/null 2>&1; then
            echo 'zyn-ai@1.7.0 is already published; skipping.'
          else
            npm publish --access public --provenance
          fi
